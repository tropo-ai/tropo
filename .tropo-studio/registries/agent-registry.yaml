# Agent Registry — the roster of agents registered in this Studio.
#
# Rule: not in this registry = not authorized to operate in this vault.
#
# ---------------------------------------------------------------------------
# THE SHAPE, and why it is one map instead of two
# ---------------------------------------------------------------------------
# Everything registers under ONE top-level `agents:` map. Four shipped tools
# read this file and all four consult `agents:`:
#
#   tropo-mint-id.py       REQUIRES `agents:` and raises without it
#   tropo-check-events.py  reads ("user_agents", "agents")
#   tropo-emit-event.py    reads ("user_agents", "agents")
#   tropo-validate.py      reads `agents`
#
# Until v1.93 this template shipped `system_agents:` / `user_agents: {}` and no
# `agents:` map at all. That satisfied two of the four readers and broke the
# other two: typed minting failed for EVERY author with "agent registry has no
# agents mapping for mint provenance", and a newly created agent could not clear
# its own boot drain. Found by the v1.93 Release Test Harness walking a real box.
#
# ---------------------------------------------------------------------------
# REGISTERING YOUR OWN AGENT — the shape typed minting needs
# ---------------------------------------------------------------------------
# Add a row keyed by the agent's 8-hex UID. For an agent that will AUTHOR
# governed files under a generation label (e.g. `--author vega-v1`), the three
# load-bearing fields are `type: agent`, `name:`, and `generation-prefix:`.
# Without all three, minting still works but records no agent provenance.
#
#   agents:
#     a1b2c3d4:                      # mint one with: tropo-mint-id.py --kind agent
#       type: agent                  # REQUIRED for author provenance
#       name: vega                   # the agent slug, lowercase
#       generation-prefix: G         # MUST MATCH THE PREFIX IN THIS AGENT'S LINEAGE.
#                                   # `tropo-lineage.py born` issues G1 by default, so
#                                   # G is right unless you birth with --prefix. Mint
#                                   # builds the author label from THIS field and
#                                   # compares it to agents/<name>/lineage.jsonl
#                                   # EXACTLY: register G and author as vega-G1.
#                                   # Verified in a real box — registered G + born
#                                   # default + `--author vega-G1` mints clean; any
#                                   # other letter refuses with "no birth recorded".
#                                   # This example shipped a wrong letter in the first
#                                   # v1.93 cure and the harness re-run caught it.
#       class: crew
#       path: agents/vega/vega-activation.md
#       purpose: "What this agent is for."
#       status: active
#
# After adding the row, `tropo-check-events.py --as vega` resolves and the boot
# drain clears. Full walkthrough: vault/skills/tropo-create-executive-agent.md
# (§11 covers registration) — and the create-an-agent playbook routes you here.

