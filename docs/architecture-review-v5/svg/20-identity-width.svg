<rect class="bg" x="0" y="0" width="1280" height="1150"/>

<text class="title" x="32" y="44">The identity width migration</text>
<text class="subtitle" x="32" y="68">8-hex &#8594; 4+8 composite 12-hex: one shape authority, the readers that turned, the one that did not, and the filename fork underneath</text>

<!-- ============================= BAND A ============================= -->
<rect class="panel" x="32" y="92" width="1216" height="196" rx="4"/>
<text class="layer-label" x="48" y="116">THE MINT &#8212; ONE SHAPE AUTHORITY PER LANGUAGE</text>
<text class="layer-note" x="393" y="116">ADR-067 (1b08a89c, accepted 2026-08-29, shape-amended 2026-08-30): width is a module parameter, not constitution. 8-hex uids stay first-class forever &#8212; no migration.</text>

<rect class="box s-green" x="56" y="134" width="384" height="118" rx="4"/>
<text class="box-title t-green" x="70" y="152">vault/tools/lib/governed_path.py</text>
<text class="code" x="70" y="170">:89  MINT_HEX_HISTORY = (8, 12)   append-only</text>
<text class="code" x="70" y="185">:90  MINT_HEX_LEN = HISTORY[-1]  &#8594; 12</text>
<text class="code" x="70" y="200">:91  UID_SHAPES = frozenset({8, 12})</text>
<text class="code" x="70" y="215">:179 COMPOSITE_PREFIX_HEX_LEN = 4</text>
<text class="code" x="70" y="230">:191 mint_is_composite() = LEN &gt; HISTORY[0]</text>
<text class="box-mut" x="70" y="245">last entry mints; every entry stays readable</text>

<rect class="box s-steel" x="472" y="134" width="300" height="118" rx="4"/>
<text class="box-title t-steel" x="486" y="152">.tropo/studio-identity.md</text>
<text class="code" x="486" y="172">mint_prefix: f015</text>
<text class="box-sub" x="486" y="190">issued 2026-08-31, stable once set</text>
<text class="box-sub" x="486" y="206">The prefix is read, never invented.</text>
<text class="box-sub" x="486" y="222">A mint that finds no manifest refuses</text>
<text class="box-sub" x="486" y="238">rather than self-assigning one.</text>

<rect class="box s-navy" x="804" y="134" width="444" height="74" rx="4"/>
<text class="box-title t-navy" x="818" y="152">the composite &#8212; concatenated, no separator</text>
<rect x="822" y="160" width="58" height="26" rx="2" fill="#2c4a6e"/>
<text class="glyph" x="851" y="178" text-anchor="middle">f015</text>
<rect x="880" y="160" width="116" height="26" rx="2" fill="#3a6b8a"/>
<text class="glyph" x="938" y="178" text-anchor="middle">af4a6a0a</text>
<text class="glyph-d" x="1010" y="178">&#8594; f015af4a6a0a</text>
<text class="box-mut" x="822" y="200">4 hex issued</text>
<text class="box-mut" x="880" y="200">8 hex local random &#8212; 32 bits, not 48</text>

<rect class="box s-steel" x="804" y="216" width="444" height="56" rx="4"/>
<text class="box-title t-steel" x="818" y="234">tropo-app/lib/governed-path.ts &#8212; the twin</text>
<text class="box-sub" x="818" y="250">Same behaviour from two independent literals, not one append-only history: parity is</text>
<text class="box-sub" x="818" y="264">held by test &#8212; vault/tools/tests/fixtures/governed-path-vectors.json &#8212; not by shape.</text>

<!-- ============================= BAND B ============================= -->
<rect class="panel" x="32" y="304" width="1216" height="374" rx="4"/>
<text class="layer-label" x="48" y="326">WHO READS THE WIDTH &#8212; A WIDTH CHANGE IS NEVER LOCAL</text>

<!-- manifold: the one authority fans out to every reader below -->
<path class="conn" d="M248,252 L248,338 M234,338 L1073,338"/>
<path class="conn" d="M234,338 L234,352" marker-end="url(#ar)"/>
<path class="conn" d="M655,338 L655,352" marker-end="url(#ar)"/>
<path class="conn" d="M1073,338 L1073,352" marker-end="url(#ar)"/>
<text class="arrowlab" x="700" y="331">every reader below must agree with UID_SHAPES</text>

<rect class="box s-green" x="56" y="354" width="356" height="112" rx="4"/>
<text class="box-title t-green" x="70" y="372">tropo-emit-event.py + event identity</text>
<text class="box-mut" x="70" y="387">68807ff53 &#183; 2026-09-01 &#183; 6 sites, 2 failure shapes</text>
<text class="box-sub" x="70" y="404">3 &#215; re.fullmatch(r&quot;[0-9a-f]{8}&quot;) gates raised</text>
<text class="box-sub" x="70" y="419">1 dropped a 12-hex activation_uid silently</text>
<text class="box-sub" x="70" y="434">2 unanchored re.search returned the first 8 of</text>
<text class="box-sub" x="70" y="448">12 &#8212; a wrong identity, not a missing one</text>
<text class="box-mut" x="70" y="461">Until it landed, no post-flip agent could emit.</text>

<rect class="box s-green" x="56" y="482" width="356" height="86" rx="4"/>
<text class="box-title t-green" x="70" y="500">one-prompt-release-scorecard.schema.json</text>
<text class="box-mut" x="70" y="514">vault/schema/ &#183; uid patterns predated the flip</text>
<text class="code" x="70" y="532">:37 saga_id  &#183;  :42 pipeline_run_uid</text>
<text class="box-sub" x="70" y="548">now accept both widths, derived from UID_SHAPES</text>
<text class="box-mut" x="70" y="562">fa2bfd5d7 &#183; 2026-09-06 &#183; v1.95&#8217;s last blocker</text>

<rect class="box s-red" x="440" y="354" width="430" height="214" rx="4"/>
<text class="box-title t-red" x="454" y="372">.tropo/scripts/lib/release_authorization.py</text>
<text class="code-r" x="454" y="391">:440 _STEP_UID_RE = re.compile(r&quot;^[0-9a-f]{8}$&quot;)</text>
<text class="code-r" x="454" y="406">:503 &#8212; if no match, _post_mint_event_allowed</text>
<text class="code-r" x="454" y="420">     returns False</text>
<text class="code" x="454" y="435">:505 VAULT_FILES / f&quot;{step_uid}.md&quot;  &#8592; fork too</text>
<text class="code" x="454" y="450">:493 event-key reader &#8212; unlanded defect</text>
<text class="box-mut" x="454" y="464">Three defects, one function.</text>
<line class="rule" x1="454" y1="474" x2="856" y2="474"/>
<text class="box-title t-red" x="454" y="491">UNFIRED &#8212; a landmine with the pin in</text>
<text class="box-sub" x="454" y="507">All 12 of v1.95&#8217;s step uids are 8-hex: children of</text>
<text class="box-sub" x="454" y="521">pipeline 634913c2, minted 2026-05-24 &#8230; 08-16,</text>
<text class="box-sub" x="454" y="535">before the flip, and re-used by every release.</text>
<text class="box-sub" x="454" y="549">The plan lock mints only 4 uids &#8212; root, activation,</text>
<text class="box-sub" x="454" y="563">run, release (tropo-lock-release-plan.py:884-887).</text>

<rect class="box s-green" x="898" y="354" width="350" height="92" rx="4"/>
<text class="box-title t-green" x="912" y="372">Doctrine that turned</text>
<text class="code" x="912" y="391">.tropo/TROPO-CONTROL.md:61</text>
<text class="code" x="912" y="406">STUDIO.md:118</text>
<text class="box-sub" x="912" y="423">Both now read &#8220;the uid as minted&#8221; &#8212; Mike ruled</text>
<text class="box-sub" x="912" y="437">2026-09-05 that no shipped rule states a length.</text>

<rect class="box s-amber dash" x="898" y="462" width="350" height="106" rx="4"/>
<text class="box-title t-amber" x="912" y="480">Doctrine that did not &#8212; RULED, UNBUILT</text>
<text class="box-sub" x="912" y="497">106 live 8-hex rules survive, of 131 matches</text>
<text class="box-sub" x="912" y="511">across 54 files in the 5 declared roots</text>
<text class="box-sub" x="912" y="525">(re-counted by argus-a173, 2026-09-07).</text>
<text class="box-mut" x="912" y="541">dev-spec f0152efa4cd6 &#183; status: draft &#8212; never</text>
<text class="box-mut" x="912" y="554">locked, so no ignition &#183; argus-a171 &#183; target 1.96.0</text>

<!-- the cure for the red box lives in the amber spec beside it -->
<path class="conn-r" d="M870,506 L898,506" marker-end="url(#arr)"/>
<text class="arrowlab t-red" x="884" y="498" text-anchor="middle">cure</text>

<rect class="box s-red dash" x="56" y="582" width="1192" height="82" rx="4"/>
<text class="box-title t-red" x="70" y="600">It arms on the first newly minted pipeline step node &#8212; exactly what the v1.96 promotion lane would do &#8212; and would then refuse the ceremony it exists to authorize.</text>
<text class="box-sub" x="70" y="617">The cure is PROPOSED, not ruled: it is AC0 of that same draft spec, whose own census never looked at this file, because .tropo/scripts/ was not one of the five declared roots.</text>
<text class="box-mut" x="70" y="634">Never turned, unreachable by any sweep: ADR-067&#8217;s body still carries the retracted flat-random model, and ADR-048 (95886a10) clause 3 still defines the uid as &#8220;the last 8-hex segment of a</text>
<text class="box-mut" x="70" y="646">non-shipped filename&#8221; &#8212; an accepted decision may only be superseded, never edited in place (tropo-decision.capsule.md:122). STUDIO.md:114 still orders &lt;uid&gt;-&lt;slug&gt;.md, the reverse of the</text>
<text class="box-mut" x="70" y="658">anchored-suffix rule the resolver depends on &#8212; 0 governed records take that shape, so it has cost nothing yet.</text>

<!-- ============================= BAND C ============================= -->
<rect class="panel" x="32" y="694" width="1216" height="386" rx="4"/>
<text class="layer-label" x="48" y="716">THE FILENAME FORK &#8212; IDENTITY IS NOT THE FILENAME</text>
<text class="layer-note" x="424" y="716">ADR-048 (95886a10, accepted 2026-06-24): human meaning lives in filenames; uids stay invisible. Ruled in June, executed at 1.4%, contested in production.</text>

<rect class="box s-navy" x="56" y="738" width="340" height="152" rx="4"/>
<text class="box-title t-navy" x="70" y="756">ADR-048 &#8212; two tiers, plus one the code adds</text>
<text class="box-sub t-green" x="70" y="775">shipped standard library &#8594; tropo-&lt;name&gt;</text>
<text class="box-mut" x="70" y="789">vault/skills/ &#8212; 29 of 29. EXECUTED.</text>
<text class="box-sub t-amber" x="70" y="808">everything else &#8594; &lt;slug&gt;-&lt;uid&gt;.md</text>
<text class="box-mut" x="70" y="822">uid is the anchored suffix, so a resolver finds</text>
<text class="box-mut" x="70" y="835">the file by uid whatever slug precedes it.</text>
<text class="box-sub" x="70" y="854">third case, in code but not in the ADR:</text>
<text class="code" x="70" y="870">&lt;uid&gt;.md when the title yields no slug</text>
<text class="box-mut" x="70" y="883">governed_path.py:296-305 &#8212; governed_filename()</text>

<rect class="box s-amber" x="56" y="906" width="340" height="112" rx="4"/>
<text class="box-title t-amber" x="70" y="924">.tropo-studio/readable-filenames.json</text>
<text class="code" x="70" y="942">enabled: true</text>
<text class="box-mut" x="70" y="956">flipped 2026-08-31 in 83a1c8a7a</text>
<text class="box-sub" x="70" y="974">Gates PYTHON writer emission only. The TS</text>
<text class="box-sub" x="70" y="988">seams keep bare {uid}.md on a Mike-ruled</text>
<text class="box-sub" x="70" y="1002">deferral. Resolution is always on.</text>

<rect class="box s-steel" x="420" y="738" width="372" height="194" rx="4"/>
<text class="box-title t-steel" x="434" y="756">Filename shape in vault/files/</text>
<text class="box-mut" x="434" y="770">at commit 26be7d6f2, 2026-09-07 &#8212; cited by commit,</text>
<text class="box-mut" x="434" y="783">not by day: this count moved three times that day</text>
<line class="rule" x1="434" y1="792" x2="778" y2="792"/>
<text class="code" x="434" y="809">&lt;8-hex&gt;.md   pre-flip, bare</text>
<text class="num" x="712" y="809" text-anchor="end">5,168</text>
<text class="num" x="778" y="809" text-anchor="end">94.1%</text>
<text class="code" x="434" y="827">&lt;12-hex&gt;.md   composite, bare</text>
<text class="num" x="712" y="827" text-anchor="end">247</text>
<text class="num" x="778" y="827" text-anchor="end">4.5%</text>
<text class="code" x="434" y="845">&lt;slug&gt;-&lt;12-hex&gt;.md   readable</text>
<text class="num" x="712" y="845" text-anchor="end">75</text>
<text class="num" x="778" y="845" text-anchor="end">1.4%</text>
<text class="code-r" x="434" y="863">&lt;slug&gt;-&lt;8-hex&gt;.md</text>
<text class="numb" x="712" y="863" text-anchor="end">0</text>
<text class="numb" x="778" y="863" text-anchor="end">&#8212;</text>
<line class="rule" x1="434" y1="872" x2="778" y2="872"/>
<text class="code" x="434" y="888">total .md</text>
<text class="num" x="712" y="888" text-anchor="end">5,490</text>
<text class="box-mut" x="434" y="902">The zero is the finding: the &lt;slug&gt;-&lt;uid&gt; tier was ruled in June,</text>
<text class="box-mut" x="434" y="914">but only ever ran on mints made after the August flip &#8212; so two</text>
<text class="box-mut" x="434" y="926">independent changes are entangled by accident.</text>

<rect class="box s-red" x="816" y="738" width="432" height="194" rx="4"/>
<text class="box-title t-red" x="830" y="756">Readers that join the bare uid &#8212; and break on it</text>
<text class="box-sub t-red" x="830" y="775">Python &#8212; vault/tools/ and .tropo/scripts/</text>
<text class="code" x="830" y="792">80 files build &lt;files-dir&gt;/&lt;uid&gt;.md</text>
<text class="box-sub" x="830" y="808">At most 13 of them carry any slug-aware lookup:</text>
<text class="box-sub" x="830" y="822">4 call resolve_governed_path (tropo-check-one,</text>
<text class="box-sub" x="830" y="836">tropo-close-dev, tropo-lock-dev-spec, rebuild-index);</text>
<text class="box-sub" x="830" y="850">9 by their own means &#8212; tropo-recycle.py&#8217;s</text>
<text class="box-sub" x="830" y="864">glob(f&quot;*-{uid}.md&quot;), tropo-validate.py&#8217;s parse_anchored_uid.</text>
<line class="rule" x1="830" y1="873" x2="1234" y2="873"/>
<text class="box-sub t-red" x="830" y="889">Cockpit &#8212; tropo-app/</text>
<text class="box-sub" x="830" y="902">resolveGovernedPath has NO production caller &#8212; imported only</text>
<text class="box-sub" x="830" y="914">by tests/governed-path-vectors.ts. 27 non-test sites across</text>
<text class="box-sub" x="830" y="926">25 files join ${uid}.md directly.</text>

<path class="conn-r" d="M1032,932 L1032,948" marker-end="url(#arr)"/>

<rect class="box s-red" x="420" y="948" width="828" height="120" rx="4"/>
<text class="box-title t-red" x="434" y="966">2026-09-07 &#8212; the fork reached the founder&#8217;s screen</text>
<text class="tick" x="434" y="986">&#8212;&#8212;</text>
<text class="box-sub" x="468" y="986">Mike cannot open the v1.96 design brief. The cockpit error names the path it searched, vault/files/f0155c4aa2c7.md;</text>
<text class="box-sub" x="468" y="999">the file is v196-design-brief-f0155c4aa2c7.md.</text>
<text class="tick" x="434" y="1016">16:10:38</text>
<text class="box-sub" x="490" y="1016">442b94f28 renames 68 slug-prefixed files back to bare uid &#8212; chosen as the smaller act.</text>
<text class="tick" x="434" y="1030">16:12:51</text>
<text class="box-sub" x="490" y="1030">3fb127ff2 reverts it. Two minutes and thirteen seconds. The file is slug-named again today.</text>
<text class="box-mut t-red" x="434" y="1044">RULED in principle since June &#183; executed at 1.4% &#183; contested in production &#183; currently UNOWNED.</text>
<text class="box-mut t-red" x="434" y="1057">The fork is not among the four open questions the v1.96 brief carries for Mike.</text>

<!-- ============================= LEGEND ============================= -->
<text class="layer-label" x="32" y="1104">STATE</text>
<rect x="86" y="1094" width="12" height="12" rx="2" fill="#ffffff" stroke="#4a8a6b" stroke-width="1.5"/>
<text class="box-sub" x="104" y="1104">PROVEN &#8212; ran against the world and could have failed</text>
<rect x="404" y="1094" width="12" height="12" rx="2" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
<text class="box-sub" x="422" y="1104">BUILT, in routine use</text>
<rect x="558" y="1094" width="12" height="12" rx="2" fill="#ffffff" stroke="#b08a4a" stroke-width="1.5"/>
<text class="box-sub" x="576" y="1104">RULED and unbuilt, or held</text>
<rect x="742" y="1094" width="12" height="12" rx="2" fill="#ffffff" stroke="#9c2b2b" stroke-width="1.5"/>
<text class="box-sub" x="760" y="1104">KNOWN BROKEN &#8212; live defect or unlanded cure</text>
<rect class="dash" x="1024" y="1094" width="12" height="12" rx="2" fill="#ffffff" stroke="#5a6a7a" stroke-width="1.5"/>
<text class="box-sub" x="1042" y="1104">dashed: does not exist yet</text>

<text class="stamp" x="1248" y="1130" text-anchor="end">measured 2026-09-08 &#183; v1.95.0</text>
</svg>
