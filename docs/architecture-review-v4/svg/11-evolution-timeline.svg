<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: bold; fill: #1a2332; }
      .subtitle { font-size: 14px; fill: #5a6a7a; }
      .flag-title { font-size: 12.5px; font-weight: bold; fill: #1a2332; }
      .flag-sub { font-size: 11px; fill: #44525f; }
      .tick-label { font-size: 11px; fill: #5a6a7a; }
      .small-note { font-size: 10px; font-style: italic; fill: #5a6a7a; }
      .lane-name { font-size: 12px; font-weight: bold; fill: #1a2332; }
      .lane-range { font-size: 11.5px; fill: #44525f; }
      .panel-header { font-size: 14px; font-weight: bold; fill: #1a2332; }
      .panel-sub { font-size: 12px; fill: #5a6a7a; }
      .caption { font-size: 12px; fill: #5a6a7a; font-style: italic; }
      .legend-h { font-size: 11px; font-weight: bold; fill: #1a2332; }
      .legend-t { font-size: 10.5px; fill: #44525f; }
      .pole { stroke: #9aa7b4; stroke-width: 1.2; }
      .flagbox { fill: #ffffff; stroke: #c5d0da; }
    </style>
  </defs>

  <rect width="1280" height="880" fill="#fafbfc"/>
  <text x="40" y="48" class="title">v1.0 &#8594; v1.84.1 &#8212; Four Months of Self-Hosted Releases</text>
  <text x="40" y="74" class="subtitle">96 distinct OS versions &#183; 98 release records, Apr&#8211;Jul 2026 &#8212; nearly all via the system's own dev-pipeline, plus 6 non-OS product releases through the same pipeline</text>

  <!-- ===== Legend ===== -->
  <rect x="60" y="112" width="262" height="116" rx="6" fill="#eef2f6" stroke="#c5d0da"/>
  <text x="76" y="134" class="legend-h">READING THIS DIAGRAM</text>
  <circle cx="86" cy="153" r="4.5" fill="#2c4a6e"/>
  <text x="102" y="157" class="legend-t">single-release milestone (dated)</text>
  <path d="M 78 174 V 170 H 96 V 174" fill="none" stroke="#2c4a6e" stroke-width="1.5"/>
  <text x="102" y="177" class="legend-t">multi-release window (date span)</text>
  <circle cx="86" cy="193" r="4.5" fill="#fafbfc" stroke="#b08a4a" stroke-dasharray="2.5,2.5"/>
  <text x="102" y="197" class="legend-t">reserved version &#8212; pending</text>
  <rect x="76" y="207" width="22" height="10" rx="2" fill="#dbe6ee" stroke="#3a6b8a"/>
  <line x1="87" y1="207" x2="87" y2="217" stroke="#ffffff" stroke-width="2.5"/>
  <text x="102" y="216" class="legend-t">generation handoff notch</text>

  <!-- ===== Milestone flags (row 1, top) ===== -->
  <!-- v1.71 -->
  <rect x="569" y="110" width="172" height="62" rx="6" class="flagbox"/>
  <text x="581" y="130" class="flag-title">v1.71 &#183; Jun 17</text>
  <text x="581" y="147" class="flag-sub">Loop Primitive +</text>
  <text x="581" y="161" class="flag-sub">release activation key</text>
  <line x1="655" y1="172" x2="655" y2="465" class="pole"/>

  <!-- v1.84.0 -> v1.84.1 (federation) -->
  <rect x="1052" y="110" width="184" height="90" rx="6" fill="#ffffff" stroke="#4a8a6b" stroke-width="1.5"/>
  <text x="1064" y="130" class="flag-title">v1.84.x &#183; Jul 8&#8211;10</text>
  <text x="1064" y="147" class="flag-sub">federation &#8212; foundation</text>
  <text x="1064" y="161" class="flag-sub">(Jul 8) &#8594; Federation</text>
  <text x="1064" y="175" class="flag-sub">Complete + sovereignty</text>
  <text x="1064" y="189" class="flag-sub">covenant, Mike-signed</text>
  <line x1="1144" y1="200" x2="1144" y2="464" class="pole"/>

  <!-- ===== Milestone flags (row 2, middle) ===== -->
  <!-- v1.70 (v1 review baseline) -->
  <rect x="429" y="214" width="182" height="76" rx="6" fill="#ffffff" stroke="#b08a4a" stroke-width="1.5"/>
  <text x="441" y="234" class="flag-title">v1.70 &#183; Jun 14</text>
  <text x="441" y="251" class="flag-sub">the v1 review baseline &#8212;</text>
  <text x="441" y="265" class="flag-sub">14 OS releases shipped</text>
  <text x="441" y="279" class="flag-sub">in the 26 days since</text>
  <line x1="589" y1="290" x2="589" y2="465" class="pole"/>

  <!-- v1.73 - v1.74 -->
  <rect x="666" y="214" width="184" height="90" rx="6" class="flagbox"/>
  <text x="678" y="234" class="flag-title">v1.73&#8211;v1.74 &#183; Jun 19&#8211;20</text>
  <text x="678" y="251" class="flag-sub">public repo live &#8212;</text>
  <text x="678" y="265" class="flag-sub">github.com/tropo-ai/tropo;</text>
  <text x="678" y="279" class="flag-sub">Stranger-Walk gate; Po</text>
  <text x="678" y="293" class="flag-sub">(concierge) joins the crew</text>
  <line x1="722" y1="304" x2="722" y2="464" class="pole"/>

  <!-- v1.79 - v1.82 -->
  <rect x="900" y="214" width="230" height="104" rx="6" class="flagbox"/>
  <text x="912" y="234" class="flag-title">v1.79&#8211;v1.82 &#183; Jul 4&#8211;5</text>
  <text x="912" y="251" class="flag-sub">four releases in 48 hours &#8212;</text>
  <text x="912" y="265" class="flag-sub">v1.79 self-maintaining studio;</text>
  <text x="912" y="279" class="flag-sub">v1.80 security: salted keys +</text>
  <text x="912" y="293" class="flag-sub">signoff hardening; v1.81 import/</text>
  <text x="912" y="307" class="flag-sub">export receipts; v1.82 Gardener</text>
  <line x1="1044" y1="318" x2="1044" y2="464" class="pole"/>

  <!-- ===== Milestone flags (row 3, bottom) ===== -->
  <!-- v1.41 -->
  <rect x="176" y="330" width="172" height="62" rx="6" class="flagbox"/>
  <text x="188" y="350" class="flag-title">v1.41 &#183; May 16</text>
  <text x="188" y="367" class="flag-sub">Apache 2.0 license set &#8212;</text>
  <text x="188" y="381" class="flag-sub">the OS goes open source</text>
  <line x1="262" y1="392" x2="262" y2="465" class="pole"/>

  <!-- v1.76 - v1.78 -->
  <rect x="828" y="330" width="172" height="76" rx="6" class="flagbox"/>
  <text x="840" y="350" class="flag-title">v1.76&#8211;1.78 &#183; Jul 1&#8211;3</text>
  <text x="840" y="367" class="flag-sub">the v2 floor &#8212; One Home;</text>
  <text x="840" y="381" class="flag-sub">path preservation;</text>
  <text x="840" y="395" class="flag-sub">the Update Covenant</text>
  <line x1="988" y1="406" x2="988" y2="464" class="pole"/>

  <!-- v1.83 reserved note -->
  <text x="1094" y="445" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b08a4a">v1.83 One Voice</text>
  <text x="1094" y="458" text-anchor="middle" class="small-note">reserved &#183; pending</text>

  <!-- v1.1.0 start label -->
  <text x="80" y="453" font-size="10.5" fill="#5a6a7a">v1.1.0 &#183; Apr 2026</text>

  <!-- ===== Axis ===== -->
  <line x1="70" y1="470" x2="294" y2="470" stroke="#5a6a7a" stroke-width="2"/>
  <line x1="306" y1="470" x2="1212" y2="470" stroke="#5a6a7a" stroke-width="2"/>
  <path d="M 1212 464 L 1224 470 L 1212 476 Z" fill="#5a6a7a"/>
  <!-- scale break glyph -->
  <line x1="294" y1="476" x2="302" y2="464" stroke="#5a6a7a" stroke-width="1.5"/>
  <line x1="299" y1="476" x2="307" y2="464" stroke="#5a6a7a" stroke-width="1.5"/>

  <!-- month ticks -->
  <line x1="80" y1="470" x2="80" y2="477" stroke="#5a6a7a" stroke-width="1.5"/>
  <line x1="154" y1="470" x2="154" y2="477" stroke="#5a6a7a" stroke-width="1.5"/>
  <line x1="226" y1="470" x2="226" y2="477" stroke="#5a6a7a" stroke-width="1.5"/>
  <line x1="300" y1="470" x2="300" y2="477" stroke="#5a6a7a" stroke-width="1.5"/>
  <line x1="500" y1="470" x2="500" y2="477" stroke="#5a6a7a" stroke-width="1.5"/>
  <line x1="966" y1="470" x2="966" y2="477" stroke="#5a6a7a" stroke-width="1.5"/>
  <line x1="1166" y1="470" x2="1166" y2="477" stroke="#5a6a7a" stroke-width="1.5"/>
  <text x="80" y="492" text-anchor="middle" class="tick-label">Mar</text>
  <text x="154" y="492" text-anchor="middle" class="tick-label">Apr</text>
  <text x="226" y="492" text-anchor="middle" class="tick-label">May</text>
  <text x="300" y="492" text-anchor="middle" class="tick-label">Jun 1</text>
  <text x="500" y="492" text-anchor="middle" class="tick-label">Jun 10</text>
  <text x="966" y="492" text-anchor="middle" class="tick-label">Jul 1</text>
  <text x="1166" y="492" text-anchor="middle" class="tick-label">Jul 10</text>
  <text x="300" y="508" text-anchor="middle" class="small-note">(scale expands &#8776;9&#215; here)</text>

  <!-- anchors: dots and brackets -->
  <circle cx="80" cy="470" r="4" fill="#5a6a7a"/>
  <circle cx="262" cy="470" r="4.5" fill="#2c4a6e"/>
  <circle cx="589" cy="470" r="4.5" fill="#b08a4a"/>
  <circle cx="655" cy="470" r="4.5" fill="#2c4a6e"/>
  <path d="M 700 470 V 464 H 722 V 470" fill="none" stroke="#2c4a6e" stroke-width="1.5"/>
  <path d="M 966 470 V 464 H 1010 V 470" fill="none" stroke="#2c4a6e" stroke-width="1.5"/>
  <path d="M 1033 470 V 464 H 1055 V 470" fill="none" stroke="#2c4a6e" stroke-width="1.5"/>
  <path d="M 1121 470 V 464 H 1166 V 470" fill="none" stroke="#4a8a6b" stroke-width="1.5"/>
  <circle cx="1088" cy="470" r="4.5" fill="#fafbfc" stroke="#b08a4a" stroke-dasharray="2.5,2.5"/>

  <!-- ===== Crew generation lanes ===== -->
  <rect x="40" y="524" width="1200" height="292" rx="10" fill="#eef2f6" stroke="#c5d0da"/>
  <text x="60" y="548" class="panel-header">THE SAME FOUR MONTHS, SEEN FROM THE CREW</text>
  <text x="430" y="548" class="panel-sub">&#8212; every founding seat turned over; identity, memory, and open work survived every handoff</text>

  <!-- Argus lane -->
  <text x="80" y="574" class="lane-name">Argus &#8212; Chief Architect</text>
  <text x="1166" y="574" text-anchor="end" class="lane-range">A107 &#8594; A129 &#183; 22 handoffs since the v1 review &#8212; A129 wrote this v2</text>
  <rect x="80" y="580" width="1086" height="14" rx="3" fill="#dbe6ee" stroke="#3a6b8a"/>
  <path d="M127 580V594M174 580V594M222 580V594M269 580V594M316 580V594M363 580V594M410 580V594M458 580V594M505 580V594M552 580V594M599 580V594M647 580V594M694 580V594M741 580V594M788 580V594M835 580V594M883 580V594M930 580V594M977 580V594M1024 580V594M1072 580V594M1119 580V594" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Vela lane -->
  <text x="80" y="618" class="lane-name">Vela &#8212; Chief of Staff</text>
  <text x="1166" y="618" text-anchor="end" class="lane-range">V55 &#8594; V64 &#183; 9 handoffs since late May</text>
  <rect x="80" y="624" width="1086" height="14" rx="3" fill="#dbe6ee" stroke="#3a6b8a"/>
  <path d="M189 624V638M297 624V638M406 624V638M514 624V638M623 624V638M731 624V638M840 624V638M948 624V638M1057 624V638" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Talos lane -->
  <text x="80" y="662" class="lane-name">Talos &#8212; Engineering Lead</text>
  <text x="1166" y="662" text-anchor="end" class="lane-range">&#8230; &#8594; T28 &#183; turnover continuous</text>
  <rect x="80" y="668" width="1086" height="14" rx="3" fill="#dbe6ee" stroke="#3a6b8a"/>
  <path d="M216 668V682M352 668V682M487 668V682M623 668V682M759 668V682M894 668V682M1030 668V682" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Metis lane -->
  <text x="80" y="706" class="lane-name">Metis &#8212; Strategist</text>
  <text x="1166" y="706" text-anchor="end" class="lane-range">&#8230; &#8594; G88 &#183; turnover continuous</text>
  <rect x="80" y="712" width="1086" height="14" rx="3" fill="#dbe6ee" stroke="#3a6b8a"/>
  <path d="M201 712V726M321 712V726M442 712V726M563 712V726M683 712V726M804 712V726M925 712V726M1045 712V726" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Po lane -->
  <text x="80" y="750" class="lane-name">Po &#8212; Concierge</text>
  <text x="1166" y="750" text-anchor="end" class="lane-range">P1 &#8212; commissioned Jun 20 (v1.74), first generation still active</text>
  <text x="80" y="767" class="small-note">(role did not exist until Jun 20)</text>
  <rect x="722" y="756" width="444" height="14" rx="3" fill="#ddeee5" stroke="#4a8a6b"/>

  <!-- today line -->
  <line x1="1166" y1="500" x2="1166" y2="776" stroke="#9c2b2b" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.7"/>
  <text x="1160" y="792" text-anchor="end" font-size="10.5" fill="#9c2b2b">today &#8212; Jul 10 &#183; v1.84.1 ships</text>

  <text x="80" y="792" font-size="11" font-style="italic" fill="#44525f">One release in this window was mid-flight across three generations of two different agents &#8212; and shipped correctly.</text>
  <text x="80" y="808" class="small-note">Handoff notches: Argus and Vela counts are from the activation registry, spacing schematic (not dated); Talos and Metis lanes show end-of-window generations only.</text>

  <text x="40" y="850" class="caption">Built by the thing it describes: 96 versions in under three months through the system's own pipeline, while crew seats kept turning over &#8212; and v1.83 stays reserved until a month-long stranger walk passes.</text>
</svg>
