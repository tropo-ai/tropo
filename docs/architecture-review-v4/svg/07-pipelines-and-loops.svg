<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 920" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: bold; fill: #1a2332; }
      .subtitle { font-size: 14px; fill: #5a6a7a; }
      .panel-title { font-size: 15px; font-weight: bold; fill: #1a2332; }
      .node { font-size: 13px; font-weight: bold; fill: #1a2332; }
      .node-sub { font-size: 11px; fill: #5a6a7a; }
      .label { font-size: 12px; fill: #44525f; }
      .small { font-size: 10.5px; fill: #5a6a7a; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #2c4a6e; }
      .edge { stroke: #8aa0b5; stroke-width: 1.8; fill: none; }
      .edge-r { stroke: #9c2b2b; stroke-width: 1.8; fill: none; }
      .caption { font-size: 12px; fill: #5a6a7a; font-style: italic; }
      .stage { font-size: 12.5px; font-weight: bold; fill: #ffffff; }
      .badge { font-size: 12px; font-weight: bold; fill: #ffffff; }
    </style>
    <marker id="arr7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa0b5"/>
    </marker>
    <marker id="arr7r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9c2b2b"/>
    </marker>
  </defs>

  <rect width="1280" height="920" fill="#fafbfc"/>
  <text x="40" y="48" class="title">Pipelines, Playbooks + Loops — Three Orchestration Classes, One Gate Discipline</text>
  <text x="40" y="72" class="subtitle">Pipelines: DAG templates with typed runs · Playbooks: gated language procedures · Loops (v1.71): recurring autonomy with brakes. The dev-pipeline ships Tropo itself.</text>

  <!-- Class 1: Pipelines -->
  <rect x="40" y="100" width="388" height="306" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <circle cx="72" cy="126" r="11" fill="#2c4a6e"/>
  <text x="72" y="130.5" class="badge" text-anchor="middle">1</text>
  <text x="92" y="131" class="panel-title">Pipelines — declarative DAGs</text>

  <rect x="60" y="150" width="348" height="90" rx="8" fill="#2c4a6e"/>
  <text x="76" y="174" class="node" fill="#ffffff">pipeline (template)</text>
  <text x="76" y="194" class="node-sub" fill="#cfe0ee">DAG of WorkflowNodes:</text>
  <text x="76" y="210" class="node-sub" fill="#cfe0ee">pipeline → stage → step;</text>
  <text x="76" y="226" class="node-sub" fill="#cfe0ee">authored once · versioned · governed</text>

  <path class="edge" d="M 234 240 L 234 256" marker-end="url(#arr7)"/>

  <rect x="60" y="258" width="348" height="104" rx="8" fill="#3a6b8a"/>
  <text x="76" y="282" class="node" fill="#ffffff">pipeline-run (typed instance)</text>
  <text x="76" y="302" class="node-sub" fill="#d6e6ef">pins the template version at start;</text>
  <text x="76" y="318" class="node-sub" fill="#d6e6ef">roots its own project;</text>
  <text x="76" y="334" class="node-sub" fill="#d6e6ef">own run folder + run.jsonl event log</text>

  <text x="60" y="390" class="label" font-weight="bold">A run is a governed record, not a console log.</text>

  <!-- Class 2: Playbooks -->
  <rect x="448" y="100" width="388" height="306" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <circle cx="480" cy="126" r="11" fill="#2c4a6e"/>
  <text x="480" y="130.5" class="badge" text-anchor="middle">2</text>
  <text x="500" y="131" class="panel-title">Playbooks — gated procedures</text>

  <text x="468" y="160" class="label">Governed natural-language workflows an</text>
  <text x="468" y="177" class="label">agent reads and executes: activation,</text>
  <text x="468" y="194" class="label">retirement, cold-boot testing, apply-</text>
  <text x="468" y="211" class="label">update, fleet-ops, onboarding.</text>

  <rect x="468" y="228" width="348" height="102" rx="6" fill="#eef2f6"/>
  <text x="484" y="252" class="node">Milestone gating</text>
  <text x="484" y="272" class="node-sub">Gated playbooks write milestone events</text>
  <text x="484" y="288" class="node-sub">to the run's run.jsonl. A later group</text>
  <text x="484" y="304" class="node-sub">cannot begin until the prior milestone</text>
  <text x="484" y="320" class="node-sub">event exists on disk.</text>

  <text x="468" y="358" class="label" font-weight="bold">The playbook is both the spec and the</text>
  <text x="468" y="375" class="label" font-weight="bold">audit trail of its own execution.</text>

  <!-- Class 3: Loops -->
  <rect x="856" y="100" width="384" height="306" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <circle cx="888" cy="126" r="11" fill="#4a8a6b"/>
  <text x="888" y="130.5" class="badge" text-anchor="middle">3</text>
  <text x="908" y="131" class="panel-title">Loops — recurring autonomy</text>
  <rect x="1140" y="112" width="84" height="22" rx="11" fill="#4a8a6b"/>
  <text x="1182" y="127" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">NEW v1.71</text>

  <text x="876" y="160" class="mono">type: loop declares</text>
  <text x="876" y="177" class="label">goal · trigger · cadence · runner · verifier</text>

  <rect x="876" y="192" width="348" height="90" rx="6" fill="#fbecec" stroke="#9c2b2b"/>
  <text x="892" y="214" font-size="12.5" font-weight="bold" fill="#9c2b2b">BRAKES — every loop carries them</text>
  <text x="892" y="234" class="node-sub" fill="#44525f">spend caps · wall-clock kills ·</text>
  <text x="892" y="250" class="node-sub" fill="#44525f">iteration hard-stops · consent_mode:</text>
  <text x="892" y="266" class="node-sub" fill="#44525f">ask (default) / auto by owner ruling only</text>

  <text x="876" y="304" class="node" font-size="12">6 live loops</text>
  <text x="876" y="322" class="node-sub">daily vault health · weekly integrity audit ·</text>
  <text x="876" y="338" class="node-sub">update discovery · git backstop · gardener</text>
  <text x="876" y="354" class="node-sub">decay pass · draft dispatcher</text>

  <text x="876" y="378" class="label" font-weight="bold">Cost stamped null-honest from real API</text>
  <text x="876" y="395" class="label" font-weight="bold">metering — never estimated or fabricated.</text>

  <!-- Dev-pipeline DAG -->
  <rect x="40" y="428" width="1200" height="306" rx="10" fill="#eef2f6" stroke="#c5d0da"/>
  <text x="60" y="458" class="panel-title">The dev-pipeline — how Tropo ships Tropo (98 OS release records · 96 distinct versions since April 2026)</text>

  <g>
    <rect x="60" y="474" width="170" height="76" rx="8" fill="#2c4a6e"/>
    <text x="145" y="502" class="stage" text-anchor="middle">DESIGN BRIEF</text>
    <text x="145" y="522" class="node-sub" fill="#cfe0ee" text-anchor="middle">pair-design walk,</text>
    <text x="145" y="538" class="node-sub" fill="#cfe0ee" text-anchor="middle">captured + accepted</text>

    <rect x="252" y="474" width="170" height="76" rx="8" fill="#2c4a6e"/>
    <text x="337" y="502" class="stage" text-anchor="middle">DEV-SPEC · LOCKED</text>
    <text x="337" y="522" class="node-sub" fill="#cfe0ee" text-anchor="middle">adversarial review</text>
    <text x="337" y="538" class="node-sub" fill="#cfe0ee" text-anchor="middle">gauntlet before lock</text>

    <rect x="444" y="474" width="170" height="76" rx="8" fill="#3a6b8a"/>
    <text x="529" y="502" class="stage" text-anchor="middle">BUILD</text>
    <text x="529" y="522" class="node-sub" fill="#d6e6ef" text-anchor="middle">substrate authored;</text>
    <text x="529" y="538" class="node-sub" fill="#d6e6ef" text-anchor="middle">criteria explicit</text>

    <rect x="636" y="474" width="170" height="76" rx="8" fill="#b08a4a"/>
    <text x="721" y="502" class="stage" text-anchor="middle">VERIFY</text>
    <text x="721" y="522" class="node-sub" fill="#f3e8d2" text-anchor="middle">raw run events</text>
    <text x="721" y="538" class="node-sub" fill="#f3e8d2" text-anchor="middle">checked vs. claims</text>

    <rect x="828" y="474" width="170" height="76" rx="8" fill="#2c4a6e"/>
    <text x="913" y="502" class="stage" text-anchor="middle">SHIP GATES</text>
    <text x="913" y="522" class="node-sub" fill="#cfe0ee" text-anchor="middle">docs · tests · sign-offs ·</text>
    <text x="913" y="538" class="node-sub" fill="#cfe0ee" text-anchor="middle">cascade closed</text>

    <rect x="1020" y="474" width="170" height="76" rx="8" fill="#4a8a6b"/>
    <text x="1105" y="502" class="stage" text-anchor="middle">CUT</text>
    <text x="1105" y="522" class="node-sub" fill="#dcefe4" text-anchor="middle">version flips;</text>
    <text x="1105" y="538" class="node-sub" fill="#dcefe4" text-anchor="middle">cycle root archived</text>
  </g>
  <path class="edge" d="M 230 512 L 252 512" marker-end="url(#arr7)"/>
  <path class="edge" d="M 422 512 L 444 512" marker-end="url(#arr7)"/>
  <path class="edge" d="M 614 512 L 636 512" marker-end="url(#arr7)"/>
  <path class="edge" d="M 806 512 L 828 512" marker-end="url(#arr7)"/>
  <path class="edge" d="M 998 512 L 1020 512" marker-end="url(#arr7)"/>

  <!-- ADR-052 note -->
  <path class="edge" d="M 337 550 L 337 596" marker-end="url(#arr7)"/>
  <rect x="60" y="598" width="420" height="96" rx="6" fill="#fdf6ea" stroke="#b08a4a"/>
  <text x="76" y="622" font-size="12.5" font-weight="bold" fill="#1a2332">ADR-052 — lock-time coupling</text>
  <text x="76" y="642" class="node-sub" fill="#44525f">Locking a dev-spec atomically registers its pipeline</text>
  <text x="76" y="658" class="node-sub" fill="#44525f">activation — the chain dev-spec ↔ activation ↔ build</text>
  <text x="76" y="674" class="node-sub" fill="#44525f">↔ release is complete by construction, not discipline.</text>

  <!-- Cascade fork -->
  <text x="560" y="568" class="small">one cycle activation triggers both cascade legs</text>
  <path class="edge" d="M 529 550 L 529 574 L 940 574" fill="none"/>
  <path class="edge" d="M 650 574 L 650 596" marker-end="url(#arr7)"/>
  <path class="edge" d="M 940 574 L 940 596" marker-end="url(#arr7)"/>

  <rect x="520" y="598" width="260" height="60" rx="6" fill="#ffffff" stroke="#3a6b8a"/>
  <text x="536" y="620" class="node" fill="#2c4a6e">doc-pipeline run</text>
  <text x="536" y="637" class="small">docs current with the release; auto-pass</text>
  <text x="536" y="651" class="small">only when no doc obligation declared</text>

  <rect x="810" y="598" width="260" height="60" rx="6" fill="#ffffff" stroke="#3a6b8a"/>
  <text x="826" y="620" class="node" fill="#2c4a6e">test-pipeline run</text>
  <text x="826" y="637" class="small">verification evidence with every release;</text>
  <text x="826" y="651" class="small">stub specs are a detected defect class</text>

  <!-- Close constraint join -->
  <path class="edge-r" d="M 650 658 L 650 682 L 1105 682 L 1105 554" marker-end="url(#arr7r)"/>
  <path class="edge-r" d="M 940 658 L 940 682"/>
  <text x="660" y="702" font-size="11" fill="#9c2b2b" font-weight="bold">release cannot close until both legs reach a terminal state</text>

  <!-- Honest note strip -->
  <rect x="40" y="756" width="1200" height="96" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <rect x="40" y="756" width="6" height="96" fill="#9c2b2b"/>
  <text x="64" y="782" font-size="13" font-weight="bold" fill="#1a2332">Field report — the first end-to-end close-ceremony drive (v1.84.1) surfaced six real, pre-existing runtime bugs</text>
  <text x="64" y="804" class="node-sub" fill="#44525f">Dropped verification commands · a re-trigger gate that refused forever (checked existence, not status) · a test step silently degenerated</text>
  <text x="64" y="821" class="node-sub" fill="#44525f">to a no-op pass · stale-spec resolution · a recompute crash · step definitions pointing at nonexistent scripts.</text>
  <text x="64" y="840" class="node-sub" fill="#1a2332" font-weight="bold">All six found by checking raw run events against claims, not labels — all six fixed; regression-test hardening track open.</text>

  <text x="40" y="886" class="caption">Three orchestration classes, one discipline: a step that did not run cannot be recorded as run — and when the bookkeeping machinery itself broke, the record names it.</text>
</svg>
