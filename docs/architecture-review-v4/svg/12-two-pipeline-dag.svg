<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: bold; fill: #1a2332; }
      .subtitle { font-size: 14px; fill: #5a6a7a; }
      .panel-title { font-size: 15px; font-weight: bold; fill: #1a2332; }
      .node { font-size: 13px; font-weight: bold; fill: #1a2332; }
      .node-sub { font-size: 11px; fill: #5a6a7a; }
      .node-sub-explicit { font-size: 11px; }
      .node-sub-light { font-size: 11px; fill: #cfe0ee; }
      .label { font-size: 12px; fill: #44525f; }
      .small { font-size: 10.5px; fill: #5a6a7a; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #2c4a6e; }
      .edge { stroke: #8aa0b5; stroke-width: 1.8; fill: none; }
      .edge-h { stroke: #b25c2e; stroke-width: 1.8; fill: none; }
      .caption { font-size: 12px; fill: #5a6a7a; font-style: italic; }
      .stage { font-size: 12.5px; font-weight: bold; fill: #ffffff; }
      .gesture { font-size: 13px; font-weight: bold; fill: #ffffff; }
      .gesture-sub { font-size: 9.5px; fill: #f6d9c8; }
    </style>
    <marker id="arr12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa0b5"/>
    </marker>
    <marker id="arr12h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b25c2e"/>
    </marker>
  </defs>

  <rect width="1280" height="800" fill="#fafbfc"/>
  <text x="40" y="48" class="title">The Pipeline Constitution — Two Pipelines, Three Human Gestures</text>
  <text x="40" y="72" class="subtitle">§18: the dev-pipeline runs Specify → Build → Test — one run per locked spec, one tested SHA, no release artifacts. Releases are a separate pipeline, ignited only by a locked release-plan.</text>

  <!-- Lane 1: Ideation -->
  <rect x="40" y="100" width="1200" height="132" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <text x="60" y="128" class="panel-title">IDEATION — inbox, ungoverned pace</text>

  <rect x="60" y="146" width="170" height="64" rx="6" fill="#eef2f6" stroke="#9db4c8"/>
  <text x="145" y="170" class="node" text-anchor="middle">Note</text>
  <text x="145" y="190" class="node-sub" text-anchor="middle">observation · idea · finding</text>

  <path class="edge" d="M 230 178 L 256 178" marker-end="url(#arr12)"/>

  <rect x="258" y="146" width="190" height="64" rx="6" fill="#eef2f6" stroke="#9db4c8"/>
  <text x="353" y="170" class="node" text-anchor="middle">Design brief</text>
  <text x="353" y="190" class="node-sub" text-anchor="middle">the problem + the intent</text>

  <path class="edge" d="M 448 178 L 474 178" marker-end="url(#arr12)"/>

  <rect x="476" y="146" width="230" height="64" rx="6" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
  <text x="591" y="166" class="node" text-anchor="middle">Dev-spec</text>
  <text x="591" y="183" class="node-sub" text-anchor="middle">the contract: ACs + locked verify commands</text>
  <text x="591" y="198" class="node-sub" text-anchor="middle">adversarially reviewed before lock</text>

  <path class="edge" d="M 706 178 L 732 178" marker-end="url(#arr12)"/>

  <rect x="734" y="150" width="160" height="56" rx="28" fill="#b25c2e"/>
  <text x="814" y="174" class="gesture" text-anchor="middle">MIKE LOCKS</text>
  <text x="814" y="190" class="gesture-sub" text-anchor="middle">gesture 1 · dev ignition</text>

  <text x="912" y="168" class="small">the lock writes an immutable snapshot of the spec</text>
  <text x="912" y="183" class="small">+ registers activation + creates the run,</text>
  <text x="912" y="198" class="small">all in one gesture (ADR-052)</text>

  <path class="edge-h" d="M 814 206 L 814 268" marker-end="url(#arr12h)"/>

  <!-- Lane 2: Dev-pipeline -->
  <rect x="40" y="270" width="1200" height="130" rx="10" fill="#eef2f6" stroke="#c5d0da"/>
  <text x="60" y="298" class="panel-title">DEV-PIPELINE — one run per locked dev-spec</text>

  <rect x="60" y="314" width="200" height="66" rx="6" fill="#2c4a6e"/>
  <text x="160" y="338" class="stage" text-anchor="middle">SPECIFY</text>
  <text x="160" y="357" class="node-sub-light" text-anchor="middle">the locked spec is</text>
  <text x="160" y="371" class="node-sub-light" text-anchor="middle">the plan of record</text>

  <path class="edge" d="M 260 347 L 286 347" marker-end="url(#arr12)"/>

  <rect x="288" y="314" width="230" height="66" rx="6" fill="#2c4a6e"/>
  <text x="403" y="338" class="stage" text-anchor="middle">BUILD</text>
  <text x="403" y="357" class="node-sub-light" text-anchor="middle">builder implements against the frozen</text>
  <text x="403" y="371" class="node-sub-light" text-anchor="middle">contract · evidence recorded per AC</text>

  <path class="edge" d="M 518 347 L 544 347" marker-end="url(#arr12)"/>

  <rect x="546" y="314" width="270" height="66" rx="6" fill="#3a6b8a"/>
  <text x="681" y="338" class="stage" text-anchor="middle">TEST</text>
  <text x="681" y="357" class="node-sub-explicit" fill="#d6e6ef" text-anchor="middle">a non-author runs each locked verify</text>
  <text x="681" y="371" class="node-sub-explicit" fill="#d6e6ef" text-anchor="middle">command verbatim · mutation evidence</text>

  <path class="edge" d="M 816 347 L 842 347" marker-end="url(#arr12)"/>

  <rect x="844" y="314" width="376" height="66" rx="6" fill="#ffffff" stroke="#4a8a6b" stroke-dasharray="4 3"/>
  <text x="1032" y="336" class="node" text-anchor="middle">DONE = one tested commit</text>
  <text x="1032" y="355" class="node-sub" text-anchor="middle">the run closes at one tested SHA — no release artifact</text>
  <text x="1032" y="370" class="node-sub" text-anchor="middle">closure journaled, not declared</text>

  <!-- Fan-in -->
  <path class="edge" d="M 1032 380 L 1032 414 L 260 414 L 260 486" marker-end="url(#arr12)"/>
  <text x="290" y="426" class="small">done specs accumulate as ordinary done dev-specs — there is no "park" state; the release-plan fans them in by explicit list</text>

  <!-- Lane 3: Release-pipeline -->
  <rect x="40" y="432" width="1200" height="176" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <text x="60" y="460" class="panel-title">RELEASE-PIPELINE — many done specs, one version</text>

  <rect x="60" y="478" width="130" height="26" rx="5" fill="#eef2f6" stroke="#9db4c8"/>
  <text x="125" y="495" class="small" fill="#44525f" text-anchor="middle">done spec S1</text>
  <rect x="60" y="510" width="130" height="26" rx="5" fill="#eef2f6" stroke="#9db4c8"/>
  <text x="125" y="527" class="small" fill="#44525f" text-anchor="middle">done spec S2</text>
  <rect x="60" y="542" width="130" height="26" rx="5" fill="#eef2f6" stroke="#9db4c8"/>
  <text x="125" y="559" class="small" fill="#44525f" text-anchor="middle">done spec S3 …</text>
  <path class="edge" d="M 190 491 L 228 517 M 190 523 L 228 523 M 190 555 L 228 529" fill="none"/>

  <rect x="230" y="488" width="210" height="70" rx="6" fill="#ffffff" stroke="#2c4a6e" stroke-width="1.5"/>
  <text x="335" y="510" class="node" text-anchor="middle">Release-plan</text>
  <text x="335" y="528" class="node-sub" text-anchor="middle">names the version + which done</text>
  <text x="335" y="542" class="node-sub" text-anchor="middle">work ships — by explicit list</text>

  <path class="edge" d="M 440 523 L 462 523" marker-end="url(#arr12)"/>

  <rect x="464" y="495" width="150" height="56" rx="28" fill="#b25c2e"/>
  <text x="539" y="519" class="gesture" text-anchor="middle">MIKE LOCKS</text>
  <text x="539" y="535" class="gesture-sub" text-anchor="middle">gesture 2 · release ignition</text>

  <path class="edge" d="M 614 523 L 636 523" marker-end="url(#arr12)"/>

  <rect x="638" y="490" width="104" height="66" rx="6" fill="#b08a4a"/>
  <text x="690" y="512" class="stage" text-anchor="middle">ASSEMBLE</text>
  <text x="690" y="530" class="small" fill="#f3e8d2" text-anchor="middle">validate fan-in ·</text>
  <text x="690" y="544" class="small" fill="#f3e8d2" text-anchor="middle">build the box</text>

  <path class="edge" d="M 742 523 L 752 523" marker-end="url(#arr12)"/>

  <rect x="754" y="490" width="104" height="66" rx="6" fill="#b08a4a"/>
  <text x="806" y="512" class="stage" text-anchor="middle">VERIFY</text>
  <text x="806" y="530" class="small" fill="#f3e8d2" text-anchor="middle">freeze sha-bound ·</text>
  <text x="806" y="544" class="small" fill="#f3e8d2" text-anchor="middle">independent harness</text>

  <path class="edge" d="M 858 523 L 868 523" marker-end="url(#arr12)"/>

  <rect x="870" y="490" width="104" height="66" rx="6" fill="#b08a4a"/>
  <text x="922" y="512" class="stage" text-anchor="middle">PUBLISH</text>
  <text x="922" y="530" class="small" fill="#f3e8d2" text-anchor="middle">stage · preflight ·</text>
  <text x="922" y="544" class="small" fill="#f3e8d2" text-anchor="middle">await the fire</text>

  <path class="edge" d="M 974 523 L 994 523" marker-end="url(#arr12)"/>

  <rect x="996" y="495" width="136" height="56" rx="28" fill="#b25c2e"/>
  <text x="1064" y="519" class="gesture" text-anchor="middle">MIKE FIRES</text>
  <text x="1064" y="535" class="gesture-sub" text-anchor="middle">gesture 3 · deploy</text>

  <path class="edge" d="M 1132 523 L 1148 523" marker-end="url(#arr12)"/>

  <rect x="1150" y="488" width="88" height="70" rx="6" fill="#4a8a6b"/>
  <text x="1194" y="516" class="stage" text-anchor="middle" font-size="14">vX.Y.Z</text>
  <text x="1194" y="536" class="node-sub-explicit" fill="#dcefe4" text-anchor="middle">public, with</text>
  <text x="1194" y="550" class="node-sub-explicit" fill="#dcefe4" text-anchor="middle">a receipt</text>

  <text x="230" y="590" class="small">the release-plan lock — the ignition key — survived seven adversarial NO-GO rounds, every one legitimate, before its stage was accepted</text>

  <!-- Worked record strip -->
  <rect x="40" y="630" width="1200" height="90" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <rect x="40" y="630" width="6" height="90" fill="#4a8a6b"/>
  <text x="64" y="656" font-size="13" font-weight="bold" fill="#1a2332">Worked record — v1.91 in numbers: 4 dev-runs fanned in → 1 frozen package sha (3cfb4fe4…) → 1 fire at 09:36Z → v1.91.0 public</text>
  <text x="64" y="678" class="node-sub-explicit" fill="#44525f">The principal designed the split in two sentences at a whiteboard; twelve hours later it was a locked spec; six days later stages 1–5 of 9 were built and independently accepted.</text>
  <text x="64" y="695" class="node-sub-explicit" fill="#44525f">"Build complete" is an ordinary done dev-spec sitting in the vault until a release-plan names it — the two machines meet only at the fan-in.</text>

  <text x="40" y="756" class="caption">Orange is the human — by design, exactly three gestures per shipped feature: lock the spec, lock the plan, fire. Everything between them is machine-verified agent work inside two separate pipelines.</text>
</svg>
