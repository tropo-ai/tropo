<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: bold; fill: #1a2332; }
      .subtitle { font-size: 14px; fill: #5a6a7a; }
      .panel-title { font-size: 15px; font-weight: bold; fill: #1a2332; }
      .node { font-size: 13px; font-weight: bold; fill: #1a2332; }
      .node-sub { font-size: 11px; fill: #5a6a7a; }
      .node-sub-explicit { font-size: 11px; }
      .node-sub-light { font-size: 11px; fill: #cfe0ee; }
      .label { font-size: 12px; fill: #44525f; }
      .small { font-size: 10.5px; fill: #5a6a7a; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #2c4a6e; }
      .mono-lt { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #cfe0ee; }
      .mono-chip { font-family: Menlo, Consolas, monospace; font-size: 10px; fill: #e8f0f7; }
      .verb { font-family: Menlo, Consolas, monospace; font-size: 13px; font-weight: bold; fill: #ffffff; }
      .edge { stroke: #8aa0b5; stroke-width: 1.8; fill: none; }
      .caption { font-size: 12px; fill: #5a6a7a; font-style: italic; }
    </style>
    <marker id="arr13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa0b5"/>
    </marker>
  </defs>

  <rect width="1280" height="850" fill="#fafbfc"/>
  <text x="40" y="48" class="title">Lifecycle v2 — Born · Continue · Retire</text>
  <text x="40" y="72" class="subtitle">§17 (supersedes part of §4.1): three verbs over one append-only file. Existence cannot be refused — findings are recorded, never blocking. Rebuilt 2026-08-06; extended by §25's retirement driver.</text>

  <!-- Why v2 exists -->
  <rect x="40" y="96" width="1200" height="68" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <rect x="40" y="96" width="6" height="68" fill="#9c2b2b"/>
  <text x="64" y="122" font-size="13" font-weight="bold" fill="#1a2332">Why v2 exists — three agent generations were blocked at birth in one week by their own paperwork</text>
  <text x="64" y="144" class="node-sub-explicit" fill="#44525f">The principal ruled: "I never want to see my agents telling me they are failing to boot." §4.1's HALT posture is superseded — ADR-016/028 remain graph invariants, but a violation is a recorded finding, not a refused existence.</text>

  <!-- BORN column -->
  <rect x="40" y="186" width="380" height="300" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <rect x="60" y="202" width="76" height="26" rx="6" fill="#2c4a6e"/>
  <text x="98" y="220" class="verb" text-anchor="middle">born</text>
  <text x="148" y="220" class="panel-title">— one command</text>

  <rect x="60" y="240" width="340" height="76" rx="6" fill="#2c4a6e"/>
  <text x="74" y="262" class="node" fill="#ffffff">The file issues the generation</text>
  <text x="74" y="280" class="node-sub-light">highest generation in lineage.jsonl + 1 — deliberately</text>
  <text x="74" y="294" class="node-sub-light">no flag to claim a generation: no claim to verify,</text>
  <text x="74" y="308" class="node-sub-light">no mismatch to halt on</text>

  <rect x="60" y="326" width="340" height="80" rx="6" fill="#eef2f6" stroke="#9db4c8"/>
  <text x="74" y="348" class="node">Findings recorded — never blocking</text>
  <text x="74" y="366" class="node-sub">ADR-016/028 checked at the mint → recorded as</text>
  <text x="74" y="380" class="node-sub">provisional: findings on the birth line, surfaced in</text>
  <text x="74" y="394" class="node-sub">the startup signal. The agent is born either way.</text>

  <rect x="60" y="416" width="340" height="60" rx="6" fill="#eef2f6" stroke="#9db4c8"/>
  <text x="74" y="436" class="node">One crew broadcast</text>
  <text x="74" y="452" class="node-sub">emitted on born (as on retire); a failed broadcast</text>
  <text x="74" y="466" class="node-sub">never blocks — lineage is unaffected</text>

  <!-- CONTINUE column -->
  <rect x="450" y="186" width="380" height="300" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <rect x="470" y="202" width="112" height="26" rx="6" fill="#3a6b8a"/>
  <text x="526" y="220" class="verb" text-anchor="middle">continue</text>
  <text x="594" y="220" class="panel-title">— compaction ≠ retirement</text>

  <rect x="470" y="240" width="340" height="94" rx="6" fill="#3a6b8a"/>
  <text x="484" y="262" class="node" fill="#ffffff">Re-anchor from substrate, one command</text>
  <text x="484" y="280" class="node-sub-explicit" fill="#d6e6ef">a compacted agent is a stale reader of its own session:</text>
  <text x="484" y="294" class="node-sub-explicit" fill="#d6e6ef">who (never born — the phantom-generation hazard) ·</text>
  <text x="484" y="308" class="node-sub-explicit" fill="#d6e6ef">fetch · drain both event axes · list unanswered</text>
  <text x="484" y="322" class="node-sub-explicit" fill="#d6e6ef">reply_required debts · show its own recent commits</text>

  <rect x="470" y="344" width="340" height="66" rx="6" fill="#eef2f6" stroke="#9db4c8"/>
  <text x="484" y="366" class="node">Welded broadcast</text>
  <text x="484" y="384" class="node-sub">the tool emits the compaction broadcast itself — exactly</text>
  <text x="484" y="398" class="node-sub">one per continuation UID; never left to a compacted memory</text>

  <rect x="470" y="420" width="340" height="56" rx="6" fill="#eef2f6" stroke="#9db4c8"/>
  <text x="484" y="438" class="node">Per-harness trigger adapters</text>
  <text x="484" y="454" class="node-sub">Claude · Cursor · Codex · Gemini — one identical</text>
  <text x="484" y="468" class="node-sub">trigger line, copy-equality validated</text>

  <!-- RETIRE column -->
  <rect x="860" y="186" width="380" height="300" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <rect x="880" y="202" width="90" height="26" rx="6" fill="#b08a4a"/>
  <text x="925" y="220" class="verb" text-anchor="middle">retire</text>
  <text x="982" y="220" class="panel-title">— one command</text>

  <rect x="880" y="240" width="340" height="76" rx="6" fill="#b08a4a"/>
  <text x="894" y="262" class="node" fill="#ffffff">Living-transfer letter — create-only</text>
  <text x="894" y="280" class="mono" fill="#f3e8d2">agents/&lt;slug&gt;/transfers/&lt;GEN&gt;.md</text>
  <text x="894" y="296" class="node-sub-explicit" fill="#f3e8d2">create-only by mechanism, not by care — it will</text>
  <text x="894" y="310" class="node-sub-explicit" fill="#f3e8d2">not overwrite a predecessor's letter</text>

  <rect x="880" y="326" width="340" height="56" rx="6" fill="#eef2f6" stroke="#9db4c8"/>
  <text x="894" y="344" class="node">Closing lineage line + one crew broadcast</text>
  <text x="894" y="360" class="node-sub">the retired line is appended; the close's announce()</text>
  <text x="894" y="374" class="node-sub">is the single broadcast writer</text>

  <rect x="880" y="388" width="340" height="84" rx="6" fill="#fdf6ea" stroke="#b08a4a"/>
  <text x="894" y="408" class="node">§25 — the retirement driver</text>
  <text x="894" y="425" class="node-sub">verifies the eight §Required Practice steps on the world —</text>
  <text x="894" y="439" class="node-sub">a file on disk, an event on the bus; absence of evidence is</text>
  <text x="894" y="453" class="node-sub">reported open, never as pass. It never gates the close:</text>
  <text x="894" y="467" class="node-sub">"retire is one command" stands unchanged.</text>

  <!-- drops to the spine -->
  <path class="edge" d="M 230 486 L 230 550" marker-end="url(#arr13)"/>
  <text x="242" y="524" class="small">appends the birth line</text>

  <path d="M 640 486 L 640 530" stroke="#8aa0b5" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>
  <line x1="618" y1="532" x2="662" y2="532" stroke="#9c2b2b" stroke-width="2.5"/>
  <text x="652" y="524" class="small" fill="#9c2b2b">writes no lineage — nothing born, nothing retired</text>

  <path class="edge" d="M 1050 486 L 1050 550" marker-end="url(#arr13)"/>
  <text x="1062" y="524" class="small">appends the closing line</text>

  <!-- The spine -->
  <rect x="40" y="552" width="1200" height="126" rx="10" fill="#2c4a6e"/>
  <text x="64" y="580" class="panel-title" fill="#ffffff">The spine — append-only lineage</text>
  <text x="64" y="602" class="mono-lt">agents/&lt;slug&gt;/lineage.jsonl — one line per transition; the file, not a flag, is generation truth</text>

  <rect x="64" y="616" width="248" height="26" rx="5" fill="#3a6b8a"/>
  <text x="188" y="633" class="mono-chip" text-anchor="middle">{"t":"born","gen":112,"at":…,"by":…}</text>
  <path class="edge" d="M 312 629 L 336 629" marker-end="url(#arr13)" stroke="#8aa0b5"/>
  <rect x="338" y="616" width="260" height="26" rx="5" fill="#3a6b8a"/>
  <text x="468" y="633" class="mono-chip" text-anchor="middle">{"t":"retired","gen":112,"at":…,"by":…}</text>
  <path class="edge" d="M 598 629 L 622 629" marker-end="url(#arr13)" stroke="#8aa0b5"/>
  <rect x="624" y="616" width="248" height="26" rx="5" fill="#3a6b8a"/>
  <text x="748" y="633" class="mono-chip" text-anchor="middle">{"t":"born","gen":113,"at":…,"by":…}</text>
  <path class="edge" d="M 872 629 L 896 629" marker-end="url(#arr13)" stroke="#8aa0b5"/>
  <rect x="898" y="616" width="200" height="26" rx="5" fill="none" stroke="#8aa0b5" stroke-dasharray="4 3"/>
  <text x="998" y="633" class="mono-chip" text-anchor="middle" fill="#cfe0ee">next line appends here</text>

  <text x="64" y="666" class="node-sub-light">append-only, never edited · born and retire each add exactly one line · continue adds nothing — it has no path to born and writes no lineage</text>

  <!-- Single-source note -->
  <rect x="40" y="702" width="1200" height="72" rx="10" fill="#eef2f6" stroke="#c5d0da"/>
  <text x="60" y="728" class="panel-title">Single-Source S4 — lineage is the render source</text>
  <text x="60" y="748" class="label">The boot procedure derives from two fingerprint-gated sources; the crew brief renders from lineage as generation/status truth.</text>
  <text x="60" y="766" class="label">On 1M-token sleeves with survivable compaction, retirement becomes a chosen ceremony at natural stopping points — not a forced response to a full context window.</text>

  <text x="40" y="812" class="caption">Born and retire each append one line and announce once; continue re-anchors mid-life and writes no lineage — compaction is not retirement, and existence cannot be refused.</text>
</svg>
