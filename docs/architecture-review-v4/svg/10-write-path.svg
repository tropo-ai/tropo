<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: bold; fill: #1a2332; }
      .subtitle { font-size: 14px; fill: #5a6a7a; }
      .panel-title { font-size: 15px; font-weight: bold; fill: #1a2332; }
      .node { font-size: 13px; font-weight: bold; fill: #1a2332; }
      .node-sub { font-size: 11px; fill: #5a6a7a; }
      .label { font-size: 12px; fill: #44525f; }
      .small { font-size: 11px; fill: #44525f; }
      .mono { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #2c4a6e; }
      .mono-s { font-family: Menlo, Consolas, monospace; font-size: 9.5px; fill: #2c4a6e; }
      .edge { stroke: #8aa0b5; stroke-width: 1.6; fill: none; }
      .edge-d { stroke: #b08a4a; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
      .caption { font-size: 12px; fill: #5a6a7a; font-style: italic; }
      .file { font-size: 10.5px; fill: #2c4a6e; font-family: Menlo, Consolas, monospace; }
      .stage-t { font-size: 13px; font-weight: bold; fill: #ffffff; }
      .stage-s { font-size: 10.5px; fill: #ffffff; opacity: 0.85; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa0b5"/>
    </marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b08a4a"/>
    </marker>
  </defs>

  <rect width="1280" height="740" fill="#fafbfc"/>
  <text x="40" y="48" class="title">The Write Path — Life of a Governed Artifact</text>
  <text x="40" y="72" class="subtitle">Five stages from an agent's write to a rendered human surface. The file is the only truth; everything downstream is derived, gated, or flagged — never authored.</text>

  <!-- ===== Stage 1: AGENT WRITES ===== -->
  <rect x="40" y="100" width="215" height="345" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <path d="M 40 154 L 40 110 Q 40 100 50 100 L 245 100 Q 255 100 255 110 L 255 154 Z" fill="#2c4a6e"/>
  <text x="54" y="123" class="stage-t">1 · AGENT WRITES</text>
  <text x="54" y="141" class="stage-s">a typed markdown file</text>
  <rect x="54" y="166" width="187" height="100" rx="6" fill="#1e2a36"/>
  <text x="66" y="184" class="mono-s" fill="#d7e3ee">uid: 8f3a2c1d</text>
  <text x="66" y="200" class="mono-s" fill="#d7e3ee">type: task</text>
  <text x="66" y="216" class="mono-s" fill="#d7e3ee">status: active</text>
  <text x="66" y="232" class="mono-s" fill="#d7e3ee">member_of: [f4a7d2ce]</text>
  <text x="66" y="248" class="mono-s" fill="#d7e3ee">governed_by: 8dd772a0</text>
  <text x="54" y="288" class="small">The capsule is the contract:</text>
  <text x="54" y="303" class="mono-s">vault/capsules/*.capsule.md</text>
  <text x="54" y="318" class="small">required fields, enum values,</text>
  <text x="54" y="333" class="small">lifecycle states, checks.</text>
  <text x="54" y="356" class="small">64 capsule types; a per-type</text>
  <text x="54" y="371" class="small">strictness dial spends structure</text>
  <text x="54" y="386" class="small">where it pays.</text>

  <!-- ===== Stage 2: INDEX DERIVES ===== -->
  <rect x="285" y="100" width="215" height="345" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <path d="M 285 154 L 285 110 Q 285 100 295 100 L 490 100 Q 500 100 500 110 L 500 154 Z" fill="#3a6b8a"/>
  <text x="299" y="123" class="stage-t">2 · INDEX DERIVES</text>
  <text x="299" y="141" class="stage-s">one rebuild, every surface</text>
  <rect x="299" y="166" width="187" height="22" rx="4" fill="#eef2f6"/>
  <text x="307" y="181" class="file" font-size="10">00-index.jsonl · row/artifact</text>
  <rect x="299" y="194" width="187" height="22" rx="4" fill="#eef2f6"/>
  <text x="307" y="209" class="file">per-type index shards</text>
  <rect x="299" y="222" width="187" height="22" rx="4" fill="#eef2f6"/>
  <text x="307" y="237" class="file">graph edges · 18,168 typed</text>
  <rect x="299" y="250" width="187" height="22" rx="4" fill="#eef2f6"/>
  <text x="307" y="265" class="file">SQLite runtime (+ FTS5)</text>
  <text x="299" y="296" class="mono">rebuild --only &lt;uid&gt;</text>
  <text x="299" y="314" class="small">freshens one entry; a full pass</text>
  <text x="299" y="329" class="small">regenerates every surface.</text>
  <text x="299" y="352" class="small">Files are the only truth —</text>
  <text x="299" y="367" class="small">index corruption is an</text>
  <text x="299" y="382" class="small">inconvenience, not an incident.</text>

  <!-- ===== Stage 3: VALIDATOR GATES ===== -->
  <rect x="530" y="100" width="215" height="345" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <path d="M 530 154 L 530 110 Q 530 100 540 100 L 735 100 Q 745 100 745 110 L 745 154 Z" fill="#9c2b2b"/>
  <text x="544" y="123" class="stage-t">3 · VALIDATOR GATES</text>
  <text x="544" y="141" class="stage-s">94 checks · WARN→ERROR</text>
  <text x="544" y="172" class="small">New checks land at WARN and</text>
  <text x="544" y="187" class="small">ratchet to ERROR once the</text>
  <text x="544" y="202" class="small">substrate is clean.</text>
  <text x="544" y="225" class="small">UID collisions fail loud —</text>
  <text x="544" y="240" class="small">ADR-050 routes all IDs through</text>
  <text x="544" y="255" class="small">one collision-checked minter.</text>
  <rect x="544" y="272" width="187" height="24" rx="4" fill="#f7ecec" stroke="#9c2b2b"/>
  <text x="637.5" y="288" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#9c2b2b">red gate blocks the ship</text>
  <text x="544" y="320" class="small">History degrades to WARN;</text>
  <text x="544" y="335" class="small">live records stay ERROR —</text>
  <text x="544" y="350" class="small">gates bind live work; history</text>
  <text x="544" y="365" class="small">is a lint.</text>

  <!-- ===== Stage 4: GROOMERS NORMALIZE ===== -->
  <rect x="775" y="100" width="215" height="345" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <path d="M 775 154 L 775 110 Q 775 100 785 100 L 980 100 Q 990 100 990 110 L 990 154 Z" fill="#b08a4a"/>
  <text x="789" y="123" class="stage-t">4 · GROOMERS NORMALIZE</text>
  <text x="789" y="141" class="stage-s">fix the provable, flag the rest</text>
  <text x="789" y="172" class="small">Fix only the provable:</text>
  <text x="789" y="187" class="small">mechanical fixes applied in</text>
  <text x="789" y="202" class="small">place, judgment calls flagged</text>
  <text x="789" y="217" class="small">as tracked work. Nothing is</text>
  <text x="789" y="232" class="small">flagged-and-forgotten.</text>
  <text x="789" y="258" class="small">The Gardener (v1.82) stamps</text>
  <text x="789" y="273" class="small">decay flags on the derived</text>
  <text x="789" y="288" class="small">index — flag-only.</text>
  <text x="789" y="311" class="small">Two red-team agents with</text>
  <text x="789" y="326" class="small">SHA256 baselines could not</text>
  <text x="789" y="341" class="small">construct a write path to</text>
  <text x="789" y="356" class="small">source files.</text>

  <!-- ===== Stage 5: HUMAN SURFACES ===== -->
  <rect x="1020" y="100" width="215" height="345" rx="10" fill="#ffffff" stroke="#c5d0da"/>
  <path d="M 1020 154 L 1020 110 Q 1020 100 1030 100 L 1225 100 Q 1235 100 1235 110 L 1235 154 Z" fill="#4a8a6b"/>
  <text x="1034" y="123" class="stage-t">5 · HUMAN SURFACES</text>
  <text x="1034" y="141" class="stage-s">rendered projections</text>
  <rect x="1034" y="166" width="187" height="22" rx="4" fill="#eef2f6"/>
  <text x="1042" y="181" class="file">nav-block on every entry</text>
  <rect x="1034" y="194" width="187" height="22" rx="4" fill="#eef2f6"/>
  <text x="1042" y="209" class="file">00-tropo-nav/ tree</text>
  <rect x="1034" y="222" width="187" height="22" rx="4" fill="#eef2f6"/>
  <text x="1042" y="237" class="file">boards + dashboards</text>
  <rect x="1034" y="250" width="187" height="22" rx="4" fill="#eef2f6"/>
  <text x="1042" y="265" class="file">crew brief</text>
  <text x="1034" y="296" class="small">Filesystem affordances on the</text>
  <text x="1034" y="311" class="small">graph: path, parent, children,</text>
  <text x="1034" y="326" class="small">siblings, cited-by.</text>
  <text x="1034" y="349" class="small">Projections, never authored —</text>
  <text x="1034" y="364" class="small">regenerated on every rebuild,</text>
  <text x="1034" y="379" class="small">never trusted as truth.</text>

  <!-- flow arrows -->
  <path class="edge" d="M 255 272 L 285 272" marker-end="url(#arr)"/>
  <path class="edge" d="M 500 272 L 530 272" marker-end="url(#arr)"/>
  <path class="edge" d="M 745 272 L 775 272" marker-end="url(#arr)"/>
  <path class="edge" d="M 990 272 L 1020 272" marker-end="url(#arr)"/>

  <!-- hand-edit entry -->
  <path class="edge-d" d="M 200 527 C 205 495, 262 490, 268 452" marker-end="url(#arrd)"/>
  <text x="290" y="472" class="label">hand-edited files enter the same path — caught downstream, never blocked upstream</text>

  <!-- ===== Escape valves ===== -->
  <rect x="40" y="485" width="1200" height="185" rx="10" fill="#eef2f6" stroke="#c5d0da"/>
  <text x="60" y="513" class="panel-title">The escape valves — the path is paved, not gated</text>

  <rect x="60" y="527" width="373" height="128" rx="8" fill="#ffffff" stroke="#c5d0da"/>
  <text x="74" y="549" class="node">Hand-edit always works</text>
  <text x="74" y="571" class="small">The cold-boot invariant is sacrosanct: the gate may</text>
  <text x="74" y="587" class="small">WARN on a hand-written file but never hard-rejects it.</text>
  <text x="74" y="603" class="small">A stranger with a zip of the Studio can always boot it.</text>
  <text x="74" y="619" class="small">Drift is caught downstream, not blocked upstream.</text>

  <rect x="453" y="527" width="373" height="128" rx="8" fill="#ffffff" stroke="#c5d0da"/>
  <text x="467" y="549" class="node">Deletion is always soft</text>
  <text x="467" y="571" class="small">The canonical gesture moves entries to a dated recycle</text>
  <text x="467" y="587" class="small">folder with a logged reason; raw rm of governed</text>
  <text x="467" y="603" class="small">substrate is forbidden by signed doctrine. Disposition</text>
  <text x="467" y="619" class="small">refuses to recycle nodes with inbound references.</text>

  <rect x="846" y="527" width="373" height="128" rx="8" fill="#ffffff" stroke="#c5d0da"/>
  <text x="860" y="549" class="node">Every archive points forward (ADR-047)</text>
  <text x="860" y="571" class="small">Archived or superseded items must carry a resolvable</text>
  <text x="860" y="587" class="small">forward-pointer to their current truth — validator-</text>
  <text x="860" y="603" class="small">enforced at ERROR since v1.75. Motivation: 38% of the</text>
  <text x="860" y="619" class="small">index archived, ~157 entries carried lying flags.</text>

  <text x="40" y="710" class="caption">Tools are the paved road, never a mandatory gate — a hand-edited file rides the same derive → gate → groom → render path and is caught downstream.</text>
</svg>
