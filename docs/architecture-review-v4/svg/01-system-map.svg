<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title { font-size: 26px; font-weight: bold; fill: #1a2332; }
      .subtitle { font-size: 14px; fill: #5a6a7a; }
      .stamp { font-size: 13px; font-weight: bold; fill: #5a6a7a; }
      .layer-label { font-size: 15px; font-weight: bold; fill: #ffffff; }
      .box-title { font-size: 14px; font-weight: bold; fill: #1a2332; }
      .box-title-amber { font-size: 14px; font-weight: bold; fill: #b08a4a; }
      .box-sub { font-size: 11.5px; fill: #44525f; }
      .hub { font-size: 12.5px; font-weight: bold; fill: #1a2332; }
      .hub-sub { font-size: 10.5px; fill: #5a6a7a; }
      .caption { font-size: 12px; fill: #5a6a7a; font-style: italic; }
    </style>
  </defs>

  <rect width="1280" height="860" fill="#fafbfc"/>
  <text x="40" y="48" class="title">Tropo L1 — Studio System Map</text>
  <text x="1240" y="48" text-anchor="end" class="stamp">Tropo-OS v1.84.1 · 2026-07-10</text>
  <text x="40" y="72" class="subtitle">One Studio = one folder of markdown. No server, no database; day-to-day operation fully offline. Shown: the studio that builds Tropo (argo-os/).</text>

  <!-- ===== Layer 1: Kernel (bootstrap floor) ===== -->
  <rect x="40" y="100" width="1200" height="150" rx="10" fill="#2c4a6e" opacity="0.95"/>
  <text x="60" y="128" class="layer-label">LAYER 1 — KERNEL  ·  .tropo/  (bootstrap floor since ADR-045 — the cold-read set an agent needs before the index exists)</text>

  <rect x="60" y="142" width="220" height="92" rx="6" fill="#ffffff"/>
  <text x="72" y="164" class="box-title">Boot Configuration</text>
  <text x="72" y="182" class="box-sub">boot-config.md — Tier-1 boot floor</text>
  <text x="72" y="197" class="box-sub">Studio Tier-2 boot extension</text>
  <text x="72" y="212" class="box-sub">activation playbook pointer</text>
  <text x="72" y="227" class="box-sub">Thin pointers, read cold.</text>

  <rect x="296" y="142" width="220" height="92" rx="6" fill="#ffffff"/>
  <text x="308" y="164" class="box-title">Self-Healing + Concierge</text>
  <text x="308" y="182" class="box-sub">SELF-HEALING.md — P0, signed</text>
  <text x="308" y="197" class="box-sub">concierge/activate.md — the</text>
  <text x="308" y="212" class="box-sub">greet-first session entry point</text>
  <text x="308" y="227" class="box-sub">No index required to boot.</text>

  <rect x="532" y="142" width="220" height="92" rx="6" fill="#ffffff"/>
  <text x="544" y="164" class="box-title">Generated Catalogs</text>
  <text x="544" y="182" class="box-sub">Toolbelt — ~15 core boot tools</text>
  <text x="544" y="197" class="box-sub">3 capability catalogs (tools /</text>
  <text x="544" y="212" class="box-sub">skills / session agents), all</text>
  <text x="544" y="227" class="box-sub">regenerated from the index</text>

  <rect x="768" y="142" width="220" height="92" rx="6" fill="#ffffff"/>
  <text x="780" y="164" class="box-title">Orientation Surfaces</text>
  <text x="780" y="182" class="box-sub">orientation.md — harness map</text>
  <text x="780" y="197" class="box-sub">HUMAN-NAVIGATION.md</text>
  <text x="780" y="212" class="box-sub">Rendered views for humans;</text>
  <text x="780" y="227" class="box-sub">rebuilt, never hand-authored</text>

  <rect x="1004" y="142" width="216" height="92" rx="6" fill="#ffffff" stroke="#b08a4a" stroke-width="1.5"/>
  <text x="1016" y="164" class="box-title-amber">Moved to vault/ (ADR-045)</text>
  <text x="1016" y="182" class="box-sub">capsules (64) · playbooks ·</text>
  <text x="1016" y="197" class="box-sub">skills · tools/scripts now live</text>
  <text x="1016" y="212" class="box-sub">at vault/&lt;type&gt;/ — indexed and</text>
  <text x="1016" y="227" class="box-sub">governed (One Home, v1.76–77)</text>

  <!-- ===== Layer 2: Primitives ===== -->
  <rect x="40" y="270" width="1200" height="190" rx="10" fill="#3a6b8a" opacity="0.95"/>
  <text x="60" y="298" class="layer-label">LAYER 2 — PRIMITIVES  ·  the structural vocabulary every Studio uses</text>

  <rect x="60" y="312" width="280" height="130" rx="6" fill="#ffffff"/>
  <text x="72" y="334" class="box-title">The Vault (graph knowledge base)</text>
  <text x="72" y="352" class="box-sub">vault/files/&lt;uid&gt;.md flat store + per-type</text>
  <text x="72" y="367" class="box-sub">One-Home dirs (capsules, tools, skills…)</text>
  <text x="72" y="382" class="box-sub">4,239 indexed records · 3,740 core files</text>
  <text x="72" y="397" class="box-sub">18,168 typed edges across 4,122 nodes</text>
  <text x="72" y="412" class="box-sub">Derived: JSONL index, graph index, SQLite</text>
  <text x="72" y="427" class="box-sub">+ FTS5 — rebuilt, never authoritative</text>

  <rect x="356" y="312" width="280" height="130" rx="6" fill="#ffffff"/>
  <text x="368" y="334" class="box-title">Event Log (coordination substrate)</text>
  <text x="368" y="352" class="box-sub">vault/events/00-events.jsonl — append-only,</text>
  <text x="368" y="367" class="box-sub">CloudEvents v1.0, tool-mediated writes only</text>
  <text x="368" y="382" class="box-sub">6,103 events as of 2026-07-10</text>
  <text x="368" y="397" class="box-sub">Delivery contract: delivered → read →</text>
  <text x="368" y="412" class="box-sub">answered, per-reader receipt ledgers</text>
  <text x="368" y="427" class="box-sub">Human views = rendered projections</text>

  <rect x="652" y="312" width="280" height="130" rx="6" fill="#ffffff"/>
  <text x="664" y="334" class="box-title">Callable Surfaces (5 classes)</text>
  <text x="664" y="352" class="box-sub">Tools — 61 Python CLIs (56 registered)</text>
  <text x="664" y="367" class="box-sub">Skills — 25 shipped + 2 Studio-local</text>
  <text x="664" y="382" class="box-sub">Session agents — 16 ephemeral classes</text>
  <text x="664" y="397" class="box-sub">Actions — 10 · Loops — 6 (with brakes:</text>
  <text x="664" y="412" class="box-sub">spend caps, kills, consent gates)</text>
  <text x="664" y="427" class="box-sub">Discovery: Toolbelt + 3 catalogs</text>

  <rect x="948" y="312" width="272" height="130" rx="6" fill="#ffffff"/>
  <text x="960" y="334" class="box-title">Memory v3 + Continuity</text>
  <text x="960" y="352" class="box-sub">agent-memory.md — one curated boot read</text>
  <text x="960" y="367" class="box-sub">agent-memories.jsonl — append-only</text>
  <text x="960" y="382" class="box-sub">episodic log, never cleared</text>
  <text x="960" y="397" class="box-sub">Bounded folds: ≤15 pins / 32KB (ERROR)</text>
  <text x="960" y="412" class="box-sub">Studio-tier shared memory + doctrine</text>
  <text x="960" y="427" class="box-sub">OP-14: no harness-private memory writes</text>

  <!-- ===== Layer 3: Apps ===== -->
  <rect x="40" y="480" width="1200" height="150" rx="10" fill="#4a8a6b" opacity="0.95"/>
  <text x="60" y="508" class="layer-label">LAYER 3 — APPS  ·  what the crew builds and operates on top</text>

  <rect x="60" y="522" width="280" height="92" rx="6" fill="#ffffff"/>
  <text x="72" y="544" class="box-title">Tropo Work</text>
  <text x="72" y="562" class="box-sub">Tasks · projects · decisions (53 ADRs) ·</text>
  <text x="72" y="577" class="box-sub">design briefs · releases · notes ·</text>
  <text x="72" y="592" class="box-sub">collections. Boards + meta_status rollups</text>
  <text x="72" y="607" class="box-sub">(To Do / In Progress / Done) — computed.</text>

  <rect x="356" y="522" width="280" height="92" rx="6" fill="#ffffff"/>
  <text x="368" y="544" class="box-title">Pipelines + Loops</text>
  <text x="368" y="562" class="box-sub">Declarative DAGs + typed pipeline-runs;</text>
  <text x="368" y="577" class="box-sub">dev → doc → test coupled at the gate.</text>
  <text x="368" y="592" class="box-sub">98 OS release records, 96 versions since</text>
  <text x="368" y="607" class="box-sub">2026-04. 6 loops: autonomy with brakes.</text>

  <rect x="652" y="522" width="280" height="92" rx="6" fill="#ffffff"/>
  <text x="664" y="544" class="box-title">The Crew (agents/)</text>
  <text x="664" y="562" class="box-sub">8 active agents + human principal.</text>
  <text x="664" y="577" class="box-sub">Identity = soul + memory + vault + crew</text>
  <text x="664" y="592" class="box-sub">+ model sleeve. Architect at gen A129;</text>
  <text x="664" y="607" class="box-sub">boots measured at 1.4–4.5 minutes.</text>

  <rect x="948" y="522" width="272" height="92" rx="6" fill="#ffffff"/>
  <text x="960" y="544" class="box-title">Human Surfaces</text>
  <text x="960" y="562" class="box-sub">Rendered navigation tree · boards ·</text>
  <text x="960" y="577" class="box-sub">nav-blocks in every governed file ·</text>
  <text x="960" y="592" class="box-sub">crew brief — all projections of the log.</text>
  <text x="960" y="607" class="box-sub">Import/export: .docx/.md/.pptx + receipts</text>

  <!-- ===== Subsystem hub strip ===== -->
  <rect x="40" y="650" width="1200" height="150" rx="10" fill="#eef2f6" stroke="#c5d0da"/>
  <text x="60" y="678" class="box-title" font-size="15">THE 9 SUBSYSTEMS — each owns canonical state for its domain; every governed primitive declares its owning hub in frontmatter</text>

  <g>
    <rect x="60"  y="694" width="248" height="42" rx="5" fill="#ffffff" stroke="#c5d0da"/>
    <text x="72" y="712" class="hub">1 · Governance</text><text x="72" y="727" class="hub-sub">ADRs, validators, operating agreement</text>
    <rect x="320" y="694" width="248" height="42" rx="5" fill="#ffffff" stroke="#c5d0da"/>
    <text x="332" y="712" class="hub">2 · Rendering</text><text x="332" y="727" class="hub-sub">build pipeline, extraction, render scripts</text>
    <rect x="580" y="694" width="248" height="42" rx="5" fill="#ffffff" stroke="#c5d0da"/>
    <text x="592" y="712" class="hub">3 · Work (killer app)</text><text x="592" y="727" class="hub-sub">task/project/decision/release primitives</text>
    <rect x="840" y="694" width="180" height="42" rx="5" fill="#ffffff" stroke="#c5d0da"/>
    <text x="852" y="712" class="hub">4 · Agents</text><text x="852" y="727" class="hub-sub">crew, souls, sa.*, identity</text>
    <rect x="1032" y="694" width="188" height="42" rx="5" fill="#ffffff" stroke="#c5d0da"/>
    <text x="1044" y="712" class="hub">5 · Playbooks</text><text x="1044" y="727" class="hub-sub">governed procedures</text>
  </g>
  <g>
    <rect x="60"  y="744" width="248" height="42" rx="5" fill="#ffffff" stroke="#c5d0da"/>
    <text x="72" y="762" class="hub">6 · Library</text><text x="72" y="777" class="hub-sub">manifesto, handbook, content packs</text>
    <rect x="320" y="744" width="248" height="42" rx="5" fill="#ffffff" stroke="#c5d0da"/>
    <text x="332" y="762" class="hub">7 · Documentation</text><text x="332" y="777" class="hub-sub">KB articles, L1 entry, release notes</text>
    <rect x="580" y="744" width="248" height="42" rx="5" fill="#ffffff" stroke="#c5d0da"/>
    <text x="592" y="762" class="hub">8 · Link</text><text x="592" y="777" class="hub-sub">scheduling, persistent-agent substrate</text>
    <rect x="840" y="744" width="380" height="42" rx="5" fill="#ffffff" stroke="#c5d0da"/>
    <text x="852" y="762" class="hub">9 · Test Harness</text><text x="852" y="777" class="hub-sub">validator + ship-test-plan + cold-boot walk + agentic test composition</text>
  </g>

  <text x="40" y="836" class="caption">Since ADR-045 the kernel is a bootstrap floor; everything governed lives in the vault. Layer 2 is the vocabulary, Layer 3 is the work — the whole system is plain files: readable, diffable, auditable.</text>
</svg>
